{% extends 'base.html' %}
{% block title %}{{ title }} - Admin Panel{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="mb-4">
        <a href="{% url 'skill_list' %}" class="btn btn-sm btn-secondary-custom mb-3">
            <i class="fa-solid fa-arrow-left me-1"></i>Back to List
        </a>
        <h1 class="h3">{{ title }}</h1>
        <p class="text-muted">Enter a name for the predefined skill.</p>
    </div>

    <div class="row">
        <div class="col-lg-6">
            <div class="form-container">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label for="id_name" class="form-label">Skill Name</label>
                        {{ form.name }}
                        {% if form.name.errors %}
                            <div class="text-danger small mt-1">{{ form.name.errors }}</div>
                        {% endif %}
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100">
                        <i class="fa-solid fa-check me-2"></i>Save Skill
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
