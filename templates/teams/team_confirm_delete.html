{% extends 'base.html' %}
{% block title %}Delete Team - Admin Panel{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border border-danger">
                <div class="card-body text-center p-5">
                    <i class="fa-solid fa-triangle-exclamation fa-4x text-danger mb-4"></i>
                    <h2 class="h4 fw-bold mb-3">Delete Team?</h2>
                    <p class="text-muted mb-4">Are you sure you want to delete the team <strong>"{{ team.name }}"</strong>? This action will disassociate its recruiters and stacks, and cannot be undone.</p>
                    
                    <form method="POST">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger px-4 py-2 me-2">
                            <i class="fa-solid fa-trash me-2"></i>Delete Permanently
                        </button>
                        <a href="{% url 'team_list' %}" class="btn btn-secondary px-4 py-2">
                            Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
