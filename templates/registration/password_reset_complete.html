{% extends 'base.html' %}
{% block title %}Password Reset Complete - Talent Recruitment Portal{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center py-5">
    <div class="auth-card shadow-lg border text-center">
        <i class="fa-solid fa-circle-check fa-4x text-success mb-3"></i>
        <h2 class="h3 fw-bold mb-3">Password Changed</h2>
        <p class="text-muted mb-4">
            Your password has been successfully reset. You may now log in with your new credentials.
        </p>
        
        <div class="border-top pt-3">
            <a href="{% url 'login' %}" class="btn btn-primary-custom w-100">
                <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}
